name: Generate Snake

on:
  schedule:
    # Run at 12:00 AM every day
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update Snake
    runs-on: ubuntu-latest
    steps:
      # Snake Animation
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: YusraAnum
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake-dark.svg

      - uses: actions/checkout@v4

      - run: git config user.email "actions@github.com" && git config user.name "GitHub Actions"

      - run: git pull

      - run: git add dist/github-contribution-grid-snake.gif dist/github-contribution-grid-snake-dark.svg

      - run: |
          git commit -m "Generate Snake"
          git push
